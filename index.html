<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country İncek</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
        }
        /* İframe'in üstünde görünecek logo katmanı */
        .overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none; /* Tıklamaların alttaki tura geçmesine izin verir */
        }
        .overlay img {
            max-width: 180px;
            max-height: 80px;
            height: auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5)); /* Görselin arkasında hafif gölge */
        }
        /* İframe tam ekran ayarı */
        .ku-embed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <img src="icon.png" alt="Logo">
    </div>

    <iframe class="ku-embed" frameborder="0" allow="xr-spatial-tracking; gyroscope; accelerometer" allowfullscreen scrolling="no" src="https://kuula.co/share/collection/7T3K7?logo=1&info=1&fs=1&vr=0&sd=1&thumbs=1&inst=0"></iframe>
</body>
</html>
